<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Passer">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Paper Passer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; }
  canvas {
    width: min(100vw, 177.7vh); aspect-ratio: 16 / 9;
    touch-action: none; cursor: crosshair;
    filter: brightness(1.12);   /* the whole game a touch brighter */
  }
  @supports (height: 100dvh) { canvas { width: min(100vw, 177.7dvh); } }
  /* touch mode: forced landscape (html.rot = phone held upright, page turned 90deg); the game keeps its 16:9 shape (never stretched) */
  html.rot body { inset: auto; top: 0; left: 0; width: 100vh; height: 100vw; transform-origin: 0 0; transform: translateX(100vw) rotate(90deg); }
  @supports (height: 100dvh) { html.rot body { width: 100dvh; } }
  html.rot canvas { width: min(100vh, 177.7vw); }
  @supports (height: 100dvh) { html.rot canvas { width: min(100dvh, 177.7vw); } }
  /* touch controls (see "// --- mobile") */
  #tui { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; font: bold 11px/1 system-ui, sans-serif; color: #fff; }
  #tui.on { display: block; }
  #tui * { touch-action: none; -webkit-user-select: none; user-select: none; }
  #tui.flip #tbtns { right: auto; left: max(2vmin, env(safe-area-inset-left)); flex-direction: row; flex-wrap: wrap-reverse; }
  #tpad { position: absolute; display: none; left: 3vmin; bottom: 3vmin; width: 30vmin; height: 30vmin; max-width: 190px; max-height: 190px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: none; }
  #tknob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%; background: rgba(255,255,255,.4); border: 2px solid rgba(255,255,255,.7); }
  #tbtns { position: absolute; right: max(2vmin, env(safe-area-inset-right)); bottom: max(2vmin, env(safe-area-inset-bottom)); display: flex; flex-direction: row-reverse; flex-wrap: wrap-reverse; gap: 1.6vmin; width: min(calc(46vmin + 3.2vmin), 300px); justify-content: flex-start; align-content: flex-start; }
  .tb { pointer-events: auto; width: 15vmin; height: 15vmin; max-width: 92px; max-height: 92px; border-radius: 50%; background: rgba(20,24,40,.55); border: 2px solid rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(9px, 2.3vmin, 13px); letter-spacing: .3px; }
  .tb.big { background: rgba(255,170,40,.5); }
  .tb.on { background: rgba(255,255,255,.55); color: #000; }
  #tpause { display: none !important; position: absolute; top: max(1.5vmin, env(safe-area-inset-top)); right: max(1.5vmin, env(safe-area-inset-right)); width: 9vmin; height: 9vmin; max-width: 52px; max-height: 52px; border-radius: 12px; pointer-events: auto; background: rgba(20,24,40,.55); border: 2px solid rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  #trot { position: fixed; inset: 0; background: #111; color: #fff; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font: 600 20px system-ui, sans-serif; z-index: 9; text-align: center; padding: 20px; }
  #trot.on { display: flex; }
  #trot b { font-size: 56px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="tui"><div id="tpad"><div id="tknob"></div></div><div id="tbtns"></div><div id="tpause">II</div></div>
<div id="trot"><b>&#x21BB;</b>Rotate your phone to landscape</div>
<script src="images/logos.js"></script><script src="audio/clips.js"></script>
<script src="js/00-text.js"></script>
<script src="js/01-tuning.js"></script>
<script src="js/02-shows-sound.js"></script>
<script src="js/03-setup-stats.js"></script>
<script src="js/04-passing.js"></script>
<script src="js/05-offense-defense.js"></script>
<script src="js/06-flight-ai-loop.js"></script>
<script src="js/07-drawing.js"></script>
<script src="js/08-kicking.js"></script>
<script src="js/09-season.js"></script>
<script src="js/10-screens.js"></script>
<script src="js/11-cards-trades.js"></script>
<script src="js/12-modes-settings.js"></script>
<script src="js/13-post-online.js"></script>
<script src="js/14-career-input.js"></script>
</body>
</html>
